backend:
  name: turbo-github
  turbo_site_id: ecef7aa3-b30d-45b0-b015-f9941e227a87
  branch: main

local_backend: true
publish_mode: editorial_workflow
media_folder: _source/assets/images/uploads
public_folder: /dil/assets/images/uploads

collections:
  - name: site
    label: Site settings
    files:
      - label: Site settings
        name: site
        file: _source/_data/site.json
        fields:
          - { label: Lab name, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Tagline, name: tagline, widget: text }
          - { label: Contact email, name: email, widget: string }

  - name: people
    label: People
    folder: _source/people
    create: true
    extension: md
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Photo, name: photo, widget: image, required: false }
      - { label: Profile link, name: link, widget: string, required: false }
      - { label: Bio, name: body, widget: markdown }

  - name: projects
    label: Projects
    folder: _source/projects
    create: true
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Status, name: status, widget: string }
      - { label: Description, name: body, widget: markdown }

  - name: publications
    label: Publications
    folder: _source/publications
    create: true
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Authors, name: authors, widget: string }
      - { label: Venue, name: venue, widget: string }
      - { label: Year, name: year, widget: number }
      - { label: Date, name: date, widget: datetime }
      - { label: Link, name: link, widget: string, required: false }

  - name: news
    label: Updates
    folder: _source/news
    create: true
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Body, name: body, widget: markdown }

  - name: ordering
    label: Content order
    files:
      - label: Section item order
        name: ordering
        file: _source/_data/order.json
        fields:
          - label: People
            name: people
            widget: list
            hint: Drag to reorder people. Use each profile filename without the extension.
            field: { label: Profile filename, name: item, widget: string }
          - label: Projects
            name: projects
            widget: list
            hint: Drag to reorder projects. Use each project filename without the extension.
            field: { label: Project filename, name: item, widget: string }
          - label: Publications
            name: publications
            widget: list
            hint: Drag to reorder publications. Use each publication filename without the extension.
            field: { label: Publication filename, name: item, widget: string }
          - label: Updates
            name: news
            widget: list
            hint: Drag to reorder Updates. Use each update filename without the extension.
            field: { label: Update filename, name: item, widget: string }
