backend:
  name: github
  repo: OWNER/REPO # TODO: set to your GitHub repo
  branch: main

local_backend: true
media_folder: _source/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: people
    label: People
    folder: _source/people
    create: true
    extension: md
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Photo, name: photo, widget: image, required: false }
      - { label: Profile link, name: link, widget: string, required: false }
      - { label: Bio, name: body, widget: markdown }

  - name: projects
    label: Projects
    folder: _source/projects
    create: true
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Status, name: status, widget: string }
      - { label: Description, name: body, widget: markdown }

  - name: publications
    label: Publications
    folder: _source/publications
    create: true
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Authors, name: authors, widget: string }
      - { label: Venue, name: venue, widget: string }
      - { label: Year, name: year, widget: number }
      - { label: Date, name: date, widget: datetime }
      - { label: Link, name: link, widget: string, required: false }

  - name: news
    label: News
    folder: _source/news
    create: true
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Body, name: body, widget: markdown }
