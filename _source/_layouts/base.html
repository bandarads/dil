<!DOCTYPE html>
<html lang="en"{% if theme %} class="{{ theme }}"{% endif %}>

  <head>

    <meta charset="utf-8">

    <script>
      document.documentElement.classList.add('js');
      const theme = localStorage.getItem('theme') || 'default';
      const mode = localStorage.getItem('mode') || 'system';

      if (theme !== 'default') {
        document.documentElement.classList.add(theme);
      }

      if (mode !== 'system') {
        document.documentElement.classList.add(mode);
      }
    </script>

    <title>{% if title %}{{ title | escape }} | {% endif %}{{ site.title | escape }}</title>

    <meta name="description" content="{% if description %}{{ description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {%- if noindex -%}
    <meta name="robots" content="noindex, nofollow">
    {%- endif -%}

    {%- if canonical -%}
    <link rel="canonical" href="{{ canonical }}">
    {%- else -%}
    <link rel="canonical" href="{{ env.baseUrl }}{{ page.url }}">
    {%- endif -%}

    <link rel="alternate icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png' | url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/icons/favicon.svg' | url }}">
    <link rel="mask-icon" href="{{ '/assets/images/icons/favicon.svg' | url }}" color="#000000">
    <link rel="apple-touch-icon" href="{{ '/assets/images/icons/favicon-196x196.png' | url }}">
    <link rel="expect" href="#header" blocking="render" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Samarkan&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&display=swap">

    <style>
      {% getBundle "css" %}
    </style>

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | url }}" media="all">
    {%- if stylesheet -%}
    {%- for sheet in stylesheet -%}
    <link rel="stylesheet" href="{{ sheet }}" media="all">
    {%- endfor -%}
    {%- endif -%}

    <script src="{{ '/assets/js/app.js' | url }}" type="module"></script>
    {%- if javascript -%}
    {%- for script in javascript -%}
    <script src="{{ script }}" type="module"></script>
    {%- endfor -%}
    {%- endif -%}
  </head>

  <body {% if class %} class="{{ class }}"{% endif %}>
    {{ content }}
  </body>

</html>
