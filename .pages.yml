media:
  input: _source/assets/images/uploads
  output: /dil/assets/images/uploads
  categories: [image]

content:
  - name: site
    label: Site settings
    type: file
    path: _source/_data/site.json
    format: json
    fields:
      - name: title
        label: Lab name
        type: string
      - name: description
        type: text
      - name: tagline
        type: text
      - name: email
        label: Contact email
        type: string

  - name: display-order
    label: Display order
    type: file
    path: _source/_data/order.json
    format: json
    fields:
      - name: people
        label: People
        type: string
        list: true
      - name: alumni
        label: DIL alumni
        type: string
        list: true
      - name: projects
        label: Projects
        type: string
        list: true
      - name: publications
        label: Publications
        type: string
        list: true
      - name: news
        label: News
        type: string
        list: true

  - name: people
    label: People
    type: collection
    path: _source/people
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Name
        type: string
      - name: role
        type: string
      - name: photo
        type: image
        required: false
      - name: link
        label: Profile link
        type: string
        required: false
      - name: body
        label: Short bio
        type: rich-text
      - name: research_interests
        label: Research interests
        type: string
        list:
          max: 5
      - name: dil_projects
        label: DIL projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Project title
            type: string
          - name: description
            type: rich-text
          - name: status
            type: string
          - name: students
            label: Students involved
            type: string
          - name: partners
            label: Community or organizational partners
            type: string
          - name: link
            label: Project or demo link
            type: string
            required: false
      - name: selected_publications
        label: Selected publications
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: link
            label: DOI or webpage link
            type: string
      - name: student_involvement
        label: Student involvement
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            type: string
          - name: photo
            type: image
            required: false
          - name: description
            label: Project or collaboration
            type: text
          - name: link
            label: Project link
            type: string
            required: false
      - name: links
        label: Links
        type: object
        fields:
          - name: faculty
            label: Faculty webpage
            type: string
            required: false
          - name: scholar
            label: Google Scholar or ORCID
            type: string
            required: false
          - name: other
            label: Other relevant links
            type: string
            required: false

  - name: alumni
    label: DIL alumni
    type: collection
    path: _source/alumni
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Name
        type: string
      - name: role
        label: Role or program
        type: string
        required: false
      - name: graduation_year
        label: Graduation year
        type: string
        required: false
      - name: photo
        type: image
        required: false
      - name: link
        label: Profile link
        type: string
        required: false
      - name: body
        label: Bio
        type: rich-text
        required: false

  - name: projects
    label: Projects
    type: collection
    path: _source/projects
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: status
        type: string
      - name: body
        label: Description
        type: rich-text

  - name: publications
    label: Publications
    type: collection
    path: _source/publications
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: authors
        type: string
      - name: venue
        type: string
      - name: year
        type: number
      - name: date
        type: datetime
      - name: link
        type: string
        required: false

  - name: news
    label: News
    type: collection
    path: _source/news
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: date
        type: datetime
      - name: body
        type: rich-text
