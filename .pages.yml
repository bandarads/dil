media:
  input: _source/assets/images/uploads
  output: /dil/assets/images/uploads
  categories: [image]

content:
  - name: site
    label: Site settings
    type: file
    path: _source/_data/site.json
    format: json
    fields:
      - name: title
        label: Lab name
        type: string
      - name: description
        type: text
      - name: tagline
        type: text
      - name: email
        label: Contact email
        type: string

  - name: people
    label: People
    type: collection
    path: _source/people
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Name
        type: string
      - name: role
        type: string
      - name: photo
        type: image
        required: false
      - name: link
        label: Profile link
        type: string
        required: false
      - name: body
        label: Bio
        type: rich-text

  - name: projects
    label: Projects
    type: collection
    path: _source/projects
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: status
        type: string
      - name: body
        label: Description
        type: rich-text

  - name: publications
    label: Publications
    type: collection
    path: _source/publications
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: authors
        type: string
      - name: venue
        type: string
      - name: year
        type: number
      - name: date
        type: datetime
      - name: link
        type: string
        required: false

  - name: news
    label: News
    type: collection
    path: _source/news
    filename: "{title}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: date
        type: datetime
      - name: body
        type: rich-text
